# =============================================================================
# CONFIGMAP — visons-config
# =============================================================================
# Variables de configuración desacopladas del código de los microservicios
# Namespace: visons-prod
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: visons-config
  namespace: visons-prod
  labels:
    app.kubernetes.io/part-of: "visons-platform"
data:
  # Configuración Backend Transaccional (Spring Boot WebFlux - Java 25)
  SERVER_PORT: "9090"
  SPRING_R2DBC_URL: "r2dbc:mssql://sqlserver-service:1433/Visons"
  SPRING_R2DBC_USERNAME: "sa"
  FRONTEND_URL: "http://52.73.219.160:30080"
  JWT_EXPIRATION_MS: "36000000"
  JAVA_TOOL_OPTIONS: "-Dio.netty.allocator.type=pooled -Dio.netty.handler.ssl.defaultEndpointVerificationAlgorithm=NONE"

  # Exposición de Actuator y Métricas de Prometheus
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
  MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"

  # Configuración Backend Analítico (Flask Python 3.12)
  FLASK_PORT: "5000"
  FLASK_DEBUG: "False"
  SQL_SERVER: "sqlserver-service"
  SQL_PORT: "1433"
  SQL_DATABASE: "Visons"
  SQL_USER: "sa"
  MONGO_DB_NAME: "Visons"

  # Configuración Frontend Web (React + Vite)
  # NOTA: En Vite las variables VITE_* se inyectan en tiempo de compilación (npm run build).
  # En producción con Nginx no se leen en runtime desde el ConfigMap.
  # Se deben pasar como --build-arg en docker build (ej: http://<EIP>:30090/api/v1 y http://<EIP>:30500/api/v1/analytics).
