  GOOGLE_CLIENT_SECRET: "GOCSPX-dummy-secret-visons-sac-2026"
  
  # Credenciales Backend Analítico (Python 3.12 Flask)
  SQL_PASSWORD: "Password123!"
  MONGO_URI: "mongodb://admin:admin123@mongodb-service:27017/Visons?authSource=admin&directConnection=true"

