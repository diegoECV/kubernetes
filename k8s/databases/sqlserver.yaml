# =============================================================================
# PERSISTENCIA SQL SERVER 2022 — PVC + Deployment + Service
# =============================================================================
# Motor Relacional Transaccional para Visons S.A.C.
# Namespace: visons-prod
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-pvc
  namespace: visons-prod
  labels:
    app: sqlserver
    tier: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: visons-prod
  labels:
    app: sqlserver
    tier: database
    app.kubernetes.io/part-of: "visons-platform"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
        tier: database
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/azure-sql-edge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1433
              name: mssql
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: "Express"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: visons-secrets
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql
      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
  namespace: visons-prod
  labels:
    app: sqlserver
    tier: database
spec:
  type: ClusterIP
  selector:
    app: sqlserver
  ports:
    - name: mssql
      port: 1433
      targetPort: 1433
      protocol: TCP
