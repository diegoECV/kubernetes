# =============================================================================
# SERVICE — frontend-web
# =============================================================================
# Exposición de la interfaz de usuario web
# NodePort: 30080
# Namespace: visons-prod
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-service
  namespace: visons-prod
  labels:
    app: frontend-web
    app.kubernetes.io/part-of: "visons-platform"
spec:
  type: NodePort
  selector:
    app: frontend-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
