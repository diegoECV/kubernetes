# =============================================================================
# DEPLOYMENT — frontend-web
# =============================================================================
# Stack: React / Vite / TypeScript / TailwindCSS / Nginx
# Puerto Contenedor: 80
# Namespace: visons-prod
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: visons-prod
  labels:
    app: frontend-web
    component: ui-web
    version: "v1.0"
    app.kubernetes.io/part-of: "visons-platform"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
        component: ui-web
        version: "v1.0"
    spec:
      nodeSelector:
        role: frontend
      containers:
        - name: frontend-web
          image: diego5621/frontend-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sed -i 's|http://localhost:9090|http://52.73.219.160:30090|g; s|http://localhost:5000|http://52.73.219.160:30500|g; s|34.228.12.107|52.73.219.160|g; s|54.234.91.155|52.73.219.160|g' /usr/share/nginx/html/assets/*.js"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
